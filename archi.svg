<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" 
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" 
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LAYER 1 — CLIENTS -->
  <rect x="40" y="30" width="600" height="90" rx="12" 
        fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#0C447C" x="340" y="55" text-anchor="middle" 
        dominant-baseline="central">Clients (1a)</text>

  <rect x="80" y="68" width="200" height="40" rx="8" 
        fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#0C447C" x="180" y="88" text-anchor="middle" 
        dominant-baseline="central">Web Browser</text>

  <rect x="400" y="68" width="200" height="40" rx="8" 
        fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#0C447C" x="500" y="88" text-anchor="middle" 
        dominant-baseline="central">Mobile App (Android)</text>

  <!-- Arrow HTTPS -->
  <line x1="340" y1="120" x2="340" y2="158" stroke="#444" 
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="#555" 
        x="360" y="143" dominant-baseline="central">HTTPS / REST</text>

  <!-- LAYER 2 — BACKEND -->
  <rect x="40" y="160" width="600" height="150" rx="12" 
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="340" y="183" text-anchor="middle" 
        dominant-baseline="central">Backend (1b)</text>

  <rect x="70" y="196" width="150" height="44" rx="8" 
        fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="145" y="218" text-anchor="middle" 
        dominant-baseline="central">API Gateway</text>

  <line x1="220" y1="218" x2="248" y2="218" stroke="#444" 
        stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="250" y="196" width="110" height="40" rx="6" 
        fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="305" y="216" text-anchor="middle" 
        dominant-baseline="central">User</text>

  <rect x="368" y="196" width="110" height="40" rx="6" 
        fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="423" y="216" text-anchor="middle" 
        dominant-baseline="central">Course</text>

  <rect x="250" y="248" width="110" height="40" rx="6" 
        fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="305" y="268" text-anchor="middle" 
        dominant-baseline="central">Payment</text>

  <rect x="368" y="248" width="110" height="40" rx="6" 
        fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#085041" x="423" y="268" text-anchor="middle" 
        dominant-baseline="central">Notification</text>

  <!-- Message Broker -->
  <rect x="500" y="196" width="120" height="92" rx="8" 
        fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#412402" x="560" y="228" text-anchor="middle" 
        dominant-baseline="central">Message Broker</text>
  <text font-family="sans-serif" font-size="12" fill="#633806" 
        x="560" y="268" text-anchor="middle" 
        dominant-baseline="central">(RabbitMQ)</text>

  <line x1="480" y1="218" x2="498" y2="218" stroke="#BA7517" 
        stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="480" y1="268" x2="498" y2="268" stroke="#BA7517" 
        stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Arrows down -->
  <line x1="200" y1="312" x2="200" y2="368" stroke="#444" 
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="#555" 
        x="138" y="344" dominant-baseline="central">Sync (2a)</text>

  <line x1="480" y1="312" x2="480" y2="368" stroke="#BA7517" 
        stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="#BA7517" 
        x="492" y="344" dominant-baseline="central">Async (2b)</text>

  <!-- LAYER 3 LEFT -->
  <rect x="40" y="370" width="360" height="120" rx="12" 
        fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#2C2C2A" x="220" y="395" text-anchor="middle" 
        dominant-baseline="central">Services externes (1c)</text>
  <text font-family="sans-serif" font-size="12" fill="#5F5E5A" 
        x="220" y="420" text-anchor="middle">MTN / Orange Money</text>
  <text font-family="sans-serif" font-size="12" fill="#5F5E5A" 
        x="220" y="442" text-anchor="middle">SMS Gateway · SMTP Email</text>
  <text font-family="sans-serif" font-size="12" fill="#5F5E5A" 
        x="220" y="464" text-anchor="middle">Cloud Storage S3</text>

  <!-- LAYER 3 RIGHT -->
  <rect x="420" y="370" width="220" height="120" rx="12" 
        fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" 
        fill="#412402" x="530" y="395" text-anchor="middle" 
        dominant-baseline="central">Queue / Broker</text>
  <text font-family="sans-serif" font-size="12" fill="#633806" 
        x="530" y="422" text-anchor="middle">→ Notifications SMS/Email</text>
  <text font-family="sans-serif" font-size="12" fill="#633806" 
        x="530" y="446" text-anchor="middle">→ Rapports PDF</text>
  <text font-family="sans-serif" font-size="12" fill="#633806" 
        x="530" y="468" text-anchor="middle">→ Events inscription</text>

  <!-- LEGEND -->
  <line x1="50" y1="506" x2="100" y2="506" stroke="#444" stroke-width="1.5"/>
  <text font-family="sans-serif" font-size="11" fill="#555" 
        x="108" y="510" dominant-baseline="central">Synchrone (REST)</text>
  <line x1="260" y1="506" x2="310" y2="506" stroke="#BA7517" 
        stroke-width="1.5" stroke-dasharray="5 3"/>
  <text font-family="sans-serif" font-size="11" fill="#BA7517" 
        x="318" y="510" dominant-baseline="central">Asynchrone (Message Broker)</text>
</svg>
